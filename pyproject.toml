[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alba-collector"
version = "0.1.0"
description = "Configurable Albamon and Alba collection with explicit coverage reporting"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4==4.15.0", "playwright==1.61.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
alba-collector = "alba_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
